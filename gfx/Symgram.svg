<?xml version="1.0" encoding="UTF-8"?>
<!-- Symbian understands SVG Tiny 1.1, which has no gradients, so the disc uses
     Telegram's flat brand blue instead of its usual vertical gradient. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" baseProfile="tiny"
     width="100" height="100" viewBox="0 0 100 100">
  <circle cx="50" cy="50" r="50" fill="#229ED9"/>
  <path d="M21,48 L79,25 L69,76 L47,63 L39,73 L39,57 Z" fill="#FFFFFF"/>
  <path d="M39,57 L79,25 L47,63 Z" fill="#D2E5F1"/>
</svg>
